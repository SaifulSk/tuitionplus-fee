<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fees Receipt Generator</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding: 15px;
}

@media print {
  body {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .form, .btn {
    display: none;
  }
}

.form {
  max-width: 800px;
  margin: auto;
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.form input, .form select {
  padding: 10px;
  margin: 8px 0;
  width: 100%;
  box-sizing: border-box;
}

.button-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 15px;
  background: #C1121F;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 5px;
  margin-top: 10px;
}

.receipt {
  max-width: 700px;
  margin: auto;
  background: white;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.logo {
  width: 150px;
  display: block;
  margin: auto;
}

.title {
  text-align: center;
  font-size: 28px;
  color: #1E3A5F;
  font-weight: bold;
}

.subtitle {
  text-align: center;
  color: #555;
  margin-bottom: 20px;
}

.table {
  width: 100%;
  border-collapse: collapse;
}

.table td {
  padding: 10px;
  border: 1px solid #ddd;
  font-size: 14px;
}

.label {
  background: #f1f1f1;
  font-weight: bold;
  width: 40%;
}

.address-box {
  margin-top: 15px;
  padding: 12px;
  background: #f1f4f8;
  border-radius: 10px;
  text-align: center;
  font-size: 14px;
}

.footer {
  margin-top: 20px;
  background: #1E3A5F;
  color: white;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
}

.phone {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
}

/* MONTH TAGS */
#monthTags span {
  display: inline-flex;
  align-items: center;
  background: #1E3A5F;
  color: white;
  padding: 5px 10px;
  border-radius: 20px;
  margin: 3px;
  font-size: 13px;
}

#monthTags button {
  margin-left: 8px;
  border: none;
  background: transparent;
  color: white;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>

<body>

<!-- FORM -->
<div class="form">
  <h3>Enter Details</h3>

  <input type="text" id="name" placeholder="Student Name">

  <select id="class">
    <option value="">Select Class</option>
    <option>5</option>
    <option>6</option>
    <option>7</option>
    <option>8</option>
    <option>9</option>
    <option>10</option>
    <option>11</option>
    <option>12</option>
  </select>

  <!-- MODE OF PAYMENT (RESTORED) -->
  <select id="mode">
    <option value="">Payment Mode</option>
    <option>Cash</option>
    <option>PhonePe</option>
    <option>Google Pay</option>
    <option>Paytm</option>
    <option>Online</option>
  </select>

  <input type="date" id="date">

  <!-- MONTH PICKER + ICON -->
  <div style="display:flex; gap:10px; align-items:center;">
    <input type="month" id="month">

    <button type="button" onclick="addMonthFromPicker()" style="
      padding:10px;
      border:none;
      background:#1E3A5F;
      color:white;
      border-radius:5px;
      cursor:pointer;
      font-size:18px;
      width:45px;
    ">＋</button>
  </div>

  <!-- MONTH TAGS -->
  <div id="monthTags" style="margin-top:8px;"></div>

  <div class="button-group">
    <button class="btn" onclick="generate()">Generate</button>
    <button class="btn" id="printBtn" onclick="window.print()" style="display:none;">
      Print / Save PDF
    </button>
  </div>
</div>

<!-- RECEIPT -->
<div class="receipt">

  <img src="logo.png" class="logo">

  <div class="title">FEES PAID</div>
  <div class="subtitle">Fees Payment Received</div>

  <table class="table">
    <tr><td class="label">Student Name</td><td id="r_name">---</td></tr>
    <tr><td class="label">Class</td><td id="r_class">---</td></tr>
    <tr><td class="label">Date Paid On</td><td id="r_date">---</td></tr>
    <tr><td class="label">Month Paid For</td><td id="r_month">---</td></tr>
    <tr><td class="label">Mode Of Payment</td><td id="r_mode">---</td></tr>
  </table>

  <div class="address-box">
    Pirtala Bulu Market below Pirtala Nursing Home | Few metres away from KECS
  </div>

  <div class="footer">
    <div style="display:flex; align-items:center; gap:8px;">
      <img src="logo.png">
      <div>
        <strong>TUITION PLUS</strong><br>
        <small>Empowering Young Minds</small>
      </div>
    </div>

    <div class="phone">
      <span>8013753344</span>
    </div>
  </div>

</div>

<script>

// AUTO DATE
const today = new Date();
document.getElementById("date").value = today.toISOString().split("T")[0];

// ======================
// MONTH LOGIC
// ======================
let months = [];

// AUTO PREVIOUS MONTH FIXED
(function(){
  const d = new Date();
  d.setMonth(d.getMonth() - 1);

  const val =
    d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2,"0");

  months.push(val);
  renderTags();
})();

// ADD MONTH
function addMonthFromPicker() {
  const val = document.getElementById("month").value;

  if (!val) return;

  if (!months.includes(val)) {
    months.push(val);
    renderTags();
  }
}

// REMOVE MONTH
function removeMonth(val) {
  months = months.filter(m => m !== val);
  renderTags();
}

// RENDER TAGS
function renderTags() {
  const box = document.getElementById("monthTags");
  box.innerHTML = "";

  months.forEach(m => {
    const [y, mo] = m.split("-");
    const label = new Date(y, mo - 1).toLocaleString("en-US", {
      month: "long",
      year: "numeric"
    });

    const span = document.createElement("span");
    span.innerHTML = `
      ${label}
      <button onclick="removeMonth('${m}')">×</button>
    `;

    box.appendChild(span);
  });
}

// FORMAT DATE
function formatDate(d) {
  return new Date(d).toLocaleDateString("en-GB", {
    day: "numeric",
    month: "long",
    year: "numeric"
  });
}

// FORMAT MONTHS
function formatMonths(arr) {
  return arr.map(v => {
    const [y,m] = v.split("-");
    return new Date(y, m-1).toLocaleString("en-US", {
      month: "long",
      year: "numeric"
    });
  }).join(", ");
}

// GENERATE
function generate() {

  document.getElementById("r_name").innerText = document.getElementById("name").value;
  document.getElementById("r_class").innerText = document.getElementById("class").value;
  document.getElementById("r_date").innerText = formatDate(document.getElementById("date").value);

  document.getElementById("r_month").innerText =
    months.length ? formatMonths(months) : "---";

  document.getElementById("r_mode").innerText = document.getElementById("mode").value;

  document.getElementById("printBtn").style.display = "inline-block";
}

</script>

</body>
</html>
