<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fees Receipt Generator</title>

<style>
body {
  font-family: 'Segoe UI', sans-serif;
  background: #f4f6f9;
  margin: 0;
  padding: 15px;
}

@media print {
  body {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .form, .btn {
    display: none;
  }
}

.form {
  max-width: 800px;
  margin: auto;
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 20px;
}

.form input, .form select {
  padding: 10px;
  margin: 8px 0;
  width: 100%;
  box-sizing: border-box;
}

.button-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.btn {
  padding: 10px 15px;
  background: #C1121F;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 5px;
  margin-top: 10px;
}

.receipt {
  max-width: 700px;
  margin: auto;
  background: white;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

.logo {
  width: 150px;
  display: block;
  margin: auto;
}

.title {
  text-align: center;
  font-size: 28px;
  color: #1E3A5F;
  font-weight: bold;
}

.subtitle {
  text-align: center;
  color: #555;
  margin-bottom: 20px;
}

.table {
  width: 100%;
  border-collapse: collapse;
}

.table td {
  padding: 10px;
  border: 1px solid #ddd;
  font-size: 14px;
}

.label {
  background: #f1f1f1;
  font-weight: bold;
  width: 40%;
}

.address-box {
  margin-top: 15px;
  padding: 12px;
  background: #f1f4f8;
  border-radius: 10px;
  text-align: center;
  font-size: 14px;
}

.footer {
  margin-top: 20px;
  background: #1E3A5F;
  color: white;
  padding: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
}

.footer img {
  width: 35px;
}

.phone {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
}

@media(max-width:600px){
  .phone {
    margin-top: 15px;
  }
}

/* MONTH TAGS */
#monthTags span {
  display: inline-flex;
  align-items: center;
  background: #1E3A5F;
  color: white;
  padding: 5px 10px;
  border-radius: 20px;
  margin: 3px;
  font-size: 13px;
}

#monthTags button {
  margin-left: 8px;
  border: none;
  background: transparent;
  color: white;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="form">
  <h3>Enter Details</h3>

  <input type="text" id="name" placeholder="Student Name" autocomplete="off" />

  <select id="class">
    <option value="">Select Class</option>
    <option>5</option><option>6</option><option>7</option>
    <option>8</option><option>9</option><option>10</option>
    <option>11</option><option>12</option>
  </select>

  <select id="mode">
    <option value="">Payment Mode</option>
    <option>Cash</option>
    <option>PhonePe</option>
    <option>Google Pay</option>
    <option>Paytm</option>
    <option>Online</option>
  </select>

  <input type="date" id="date" />

  <div style="display:flex; gap:10px; align-items:center;">
    <input type="month" id="month" />
    <button type="button" onclick="addMonthFromPicker()" style="
      padding:10px;
      border:none;
      background:#1E3A5F;
      color:white;
      border-radius:5px;
      cursor:pointer;
      font-size:18px;
      width:45px;
    ">＋</button>
  </div>

  <div id="monthTags" style="margin-top:8px;"></div>

  <div class="button-group">
    <button class="btn" onclick="generate()">Generate</button>
    <button class="btn" id="printBtn" onclick="window.print()" style="display:none;">Print / Save PDF</button>
  </div>
</div>

<div class="receipt" id="receipt">
  <img class="logo" src="logo.png" />
  <div class="title">Fees Receipt</div>
  <div class="subtitle">Tuition Plus</div>

  <table class="table">
    <tr><td class="label">Student Name</td><td id="r_name"></td></tr>
    <tr><td class="label">Class</td><td id="r_class"></td></tr>
    <tr><td class="label">Date</td><td id="r_date"></td></tr>
    <tr><td class="label">Months</td><td id="r_months"></td></tr>
    <tr><td class="label">Mode</td><td id="r_mode"></td></tr>
  </table>

  <div class="address-box">
    Tuition Plus Coaching Center<br/>
    Contact: 0000000000
  </div>

  <div class="footer">
    <div>
      <img src="logo.png" />
      Tuition Plus
    </div>
    <div class="phone">📞 0000000000</div>
  </div>
</div>

<script>
let months = [];

// Auto fill today date
window.onload = () => {
  document.getElementById("date").value = new Date().toISOString().split('T')[0];

  let now = new Date();
  let prevMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
  let val = prevMonth.toISOString().slice(0,7);

  document.getElementById("month").value = val;
  addMonth(val);
};

function addMonthFromPicker() {
  let m = document.getElementById("month").value;
  if (m) addMonth(m);
}

function addMonth(m) {
  if (!months.includes(m)) {
    months.push(m);
    renderMonths();
  }
}

function removeMonth(m) {
  months = months.filter(x => x !== m);
  renderMonths();
}

function renderMonths() {
  let box = document.getElementById("monthTags");
  box.innerHTML = "";

  months.forEach(m => {
    let span = document.createElement("span");
    span.innerHTML = `
      ${formatMonth(m)}
      <button onclick="removeMonth('${m}')">×</button>
    `;
    box.appendChild(span);
  });
}

function formatMonth(m) {
  let d = new Date(m + "-01");
  return d.toLocaleString('default', { month: 'long', year: 'numeric' });
}

function generate() {
  document.getElementById("r_name").innerText = document.getElementById("name").value;
  document.getElementById("r_class").innerText = document.getElementById("class").value;
  document.getElementById("r_date").innerText = document.getElementById("date").value;
  document.getElementById("r_mode").innerText = document.getElementById("mode").value;
  document.getElementById("r_months").innerText =
    months.map(m => formatMonth(m)).join(", ");

  document.getElementById("printBtn").style.display = "inline-block";
}
</script>

</body>
</html>
